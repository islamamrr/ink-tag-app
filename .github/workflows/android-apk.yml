name: Android APK
# Builds a standalone Ink Tag APK (JavaScript bundled in, no laptop or dev
# server needed). No Expo account involved: GitHub's Ubuntu runners already
# have the Android SDK. Download it from the run's "Artifacts" section.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/android-apk.yml']
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # lets the last step update the "latest" release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: app/android
        # arm64 only, like the dev build: covers practically every phone from
        # the last several years and halves the native compile time.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p ../out
          cp android/app/build/outputs/apk/release/app-release.apk "../out/InkTag-${VERSION}-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: InkTag-apk
          path: out/*.apk
          retention-days: 30
      # Every merge to main replaces the "latest" release, so the phone can
      # always download the newest build from one fixed link:
      # https://github.com/<owner>/<repo>/releases/download/latest/InkTag.apk
      - name: Publish the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app/app.json').expo.version")
          cp app/out/*.apk InkTag.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest InkTag.apk \
            --target "$GITHUB_SHA" \
            --title "Ink Tag ${VERSION} (${GITHUB_SHA::7})" \
            --notes "Latest build from main, commit ${GITHUB_SHA::7}. Open this page on your Android phone, tap InkTag.apk, and install over the old one."
